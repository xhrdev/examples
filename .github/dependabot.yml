version: 2

# No `registries:` block. Everything here resolves from the public npm
# registry — 457 of 457 entries in package-lock.json — so declaring a
# GitHub Packages registry only made Dependabot demand a token for a
# registry nothing is fetched from.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    assignees:
      - skilbjo
    rebase-strategy: auto
    versioning-strategy: increase
    open-pull-requests-limit: 15
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    assignees:
      - skilbjo
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
      include: scope

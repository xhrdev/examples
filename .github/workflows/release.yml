name: release

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  make-ci:
    runs-on: ubuntu-latest
    # runs-on: ubuntu-24.04-arm # not until q2 2026: https://blog.chromium.org/2026/03/bringing-chrome-to-arm64-linux-devices.html
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: write
      issues: read
      actions: none
      id-token: none
      packages: none
    if: github.repository == 'xhrdev/examples' # Security: Only run on pushes to the main repository

    outputs:
      new_release_version:   ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # keep it as `secrets.GITHUB_TOKEN` as repo is public and this token has limited privs
          persist-credentials: false

      - name: Install Chromium
        run: sudo snap install chromium

      # Two things the SBSD smoke entries need that a runner does not have.
      #
      # xvfb, because they have to run headed — dev-resources/smoke.js wraps
      # them in xvfb-run. Without a display a headed Chrome dies at launch with
      # "Missing X server or $DISPLAY", which reads as a failed solve rather
      # than a missing display.
      #
      # speech-dispatcher, because without it speechSynthesis.getVoices() is
      # empty forever, and the ledger request is refused 422 invalid-carrier: a
      # browser claiming to be a desktop Chrome with no voices at all is not a
      # browser that exists. This is the one difference between a runner and a
      # developer's machine that the SBSD channel actually notices.
      - name: Install xvfb and a speech engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb speech-dispatcher

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: getsentry/action-setup-venv@v3.2.0
        with:
          venv-dir: venv
          cache-dependency-path: |
            requirements.txt
          install-cmd: pip install -r requirements.txt

      - name: Write .env for the live example/smoke suite
        env:
          ENV_HOST: ${{ secrets.HOST }}
          ENV_API_KEY: ${{ secrets.API_KEY }}
          ENV_USERNAME: ${{ secrets.USERNAME }}
          ENV_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          # No proxy= line. The suite runs direct from the runner's own
          # address, which is a fresh one per job — better for these targets
          # than one static IP shared by every script in sequence with no
          # session token to rotate, where a target that turns against it stays
          # turned for the whole run.
          #
          # The scripts all still take proxy= if you set one locally; it is
          # optional everywhere and required nowhere.
          {
            echo "host=$ENV_HOST"
            echo "api_key=$ENV_API_KEY"
            echo "username=$ENV_USERNAME"
            echo "password=$ENV_PASSWORD"
          } > .env

      - name: make test
        env:
          CHROME_PATH: /snap/bin/chromium
        run: make test

      - uses: cycjimmy/semantic-release-action@v6.0.0
        id: semantic # need an `id` for output variables
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec@6.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # keep it as `secrets.GITHUB_TOKEN` as repo is public and this token has limited privs

  docker-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    needs:
      - make-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: examples

name: release

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  make-ci:
    if: github.repository == 'xhrdev/examples' # Security: Only run on pushes to the main repository
    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit
    permissions:
      pull-requests: write
      contents: write
      issues: read
      actions: none
      id-token: none
      packages: none

  smoke:
    needs:
      - make-ci
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
    permissions:
      contents: read
      actions: none
      id-token: none
      packages: none

  docker-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    needs:
      - make-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: examples

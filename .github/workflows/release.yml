name: release

on:
  push:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  make-ci:
    runs-on: ubuntu-latest
    # runs-on: ubuntu-24.04-arm # not until q2 2026: https://blog.chromium.org/2026/03/bringing-chrome-to-arm64-linux-devices.html
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: write
      issues: read
      actions: none
      id-token: none
      packages: none
    if: github.repository == 'xhrdev/examples' # Security: Only run on pushes to the main repository

    outputs:
      new_release_version:   ${{ steps.semantic.outputs.new_release_version }}
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # keep it as `secrets.GITHUB_TOKEN` as repo is public and this token has limited privs
          persist-credentials: false

      - name: Install Chromium
        run: sudo snap install chromium

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: getsentry/action-setup-venv@v3.2.0
        with:
          venv-dir: venv
          cache-dependency-path: |
            requirements.txt
          install-cmd: pip install -r requirements.txt

      - name: Write .env for the live example/smoke suite
        env:
          ENV_HOST: ${{ secrets.HOST }}
          ENV_PROXY: ${{ secrets.PROXY }}
          ENV_API_KEY: ${{ secrets.API_KEY }}
          ENV_USERNAME: ${{ secrets.USERNAME }}
          ENV_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          {
            echo "host=$ENV_HOST"
            echo "proxy=$ENV_PROXY"
            echo "api_key=$ENV_API_KEY"
            echo "username=$ENV_USERNAME"
            echo "password=$ENV_PASSWORD"
          } > .env

      - name: make test
        env:
          CHROME_PATH: /snap/bin/chromium
        run: make test

      - uses: cycjimmy/semantic-release-action@v6.0.0
        id: semantic # need an `id` for output variables
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec@6.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # keep it as `secrets.GITHUB_TOKEN` as repo is public and this token has limited privs

  docker-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    needs:
      - make-ci
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: examples

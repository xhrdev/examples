# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: smoke

# Split out from build-and-test.yml so a change that touches the live
# targets — any src/datadome, src/akamai/sensor or src/akamai/sbsd script,
# src/mitm.ts, a solver — shows its own pass/fail in the Actions UI instead
# of being folded into the unit-test job. Shared by pr.yml and release.yml; the daily scheduled
# run lives in smoke-matrix.yml instead (three exit-IP profiles, not one).
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout-ref:
        description: >-
          Ref to check out. A PR passes its head SHA (github.event doesn't
          otherwise pin one for a workflow_call); a push leaves
          this empty and checkout uses the default ref for the triggering
          event.
        required: false
        type: string
        default: ''

defaults:
  run:
    shell: bash

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: none
      id-token: none
      packages: none

    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout-ref || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Write .env
        env:
          ENV_HOST: ${{ secrets.HOST }}
          ENV_API_KEY: ${{ secrets.API_KEY }}
          # oakley's sign-in account. Target-scoped on purpose: the generic
          # `username=`/`password=` pair is one account for a suite that has
          # more than one credentialed script coming, and `src/loadtest.ts`
          # already reads that pair for its own pass-through. Absent, the
          # script reports NOT CONFIGURED and the suite stays green — it does
          # not throw, which is what it did until 2026-10-10.
          ENV_OAKLEY_USERNAME: ${{ secrets.OAKLEY_USERNAME }}
          ENV_OAKLEY_PASSWORD: ${{ secrets.OAKLEY_PASSWORD }}
        run: |
          {
            echo "host=$ENV_HOST"
            echo "api_key=$ENV_API_KEY"
            # Written as a pair or not at all: a username with no password is a
            # failed login that reads like a solver result.
            if [[ -n "$ENV_OAKLEY_USERNAME" && -n "$ENV_OAKLEY_PASSWORD" ]]; then
              echo "oakley_username=$ENV_OAKLEY_USERNAME"
              echo "oakley_password=$ENV_OAKLEY_PASSWORD"
            fi
          } > .env

          # GitHub withholds repository secrets from runs it triggers for
          # Dependabot, so host/api_key come out empty here and every script
          # in the suite would die on `set host= in .env` — a dozen failures
          # saying nothing about the bump under test. Skip instead of failing
          # loudly; pr.yml's automerge job only waits on build-and-test
          # (unit tests), not this job, for the same reason.
          if [[ -z "$ENV_HOST" ]]; then
            echo 'no host= available for this run: skipping the smoke suite' >&2
            echo 'skip_smoke=1' >> "$GITHUB_ENV"
          fi

      - name: npm run test:smoke
        if: env.skip_smoke != '1'
        run: npm run test:smoke | tee -a "$GITHUB_STEP_SUMMARY"

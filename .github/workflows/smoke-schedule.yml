# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: smoke schedule

# An independent canary against the live targets, on its own cadence — not
# gated on a push, so it also catches upstream target drift (DataDome/Akamai
# changes) between releases. Calls the same smoke.yml job pr.yml and
# release.yml do, so there is exactly one smoke job body.
on:
  schedule:
    - cron: '0 12 * * *' # daily, 12:00 UTC
  workflow_dispatch:

jobs:
  smoke:
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
    permissions:
      contents: read
      actions: none
      id-token: none
      packages: none

name: pr

on:
  pull_request:
    branches:
      - master

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # runs-on: ubuntu-24.04-arm # not until q2 2026: https://blog.chromium.org/2026/03/bringing-chrome-to-arm64-linux-devices.html
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
      actions: none
      id-token: none
      packages: none
    if: github.event.pull_request.head.repo.full_name == github.repository # Security: Only run on PRs from the same repository

    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # keep it as `secrets.GITHUB_TOKEN` as repo is public and this token has limited privs
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      # A display for the headed SBSD entries: dev-resources/smoke.js wraps
      # them in xvfb-run, and without one a headed Chrome dies at launch with
      # "Missing X server or $DISPLAY", which reads as a failed solve.
      #
      # No speech engine here, though the SBSD channel needs one. Installing
      # speech-dispatcher, switching off the confined snap browser and giving
      # the daemon a dbus session were each tried on this runner and the voice
      # count stayed at zero through all three. The entries detect that and
      # report SKIP instead — see src/akamai/sbsd/environment.ts.
      - name: Install xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: getsentry/action-setup-venv@v3.2.0
        with:
          venv-dir: venv
          cache-dependency-path: |
            requirements.txt
          install-cmd: pip install -r requirements.txt

      - name: Write .env for the live example/smoke suite
        env:
          ENV_HOST: ${{ secrets.HOST }}
          ENV_API_KEY: ${{ secrets.API_KEY }}
          ENV_USERNAME: ${{ secrets.USERNAME }}
          ENV_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          # No proxy= line. The suite runs direct from the runner's own
          # address, which is a fresh one per job — better for these targets
          # than one static IP shared by every script in sequence with no
          # session token to rotate, where a target that turns against it stays
          # turned for the whole run.
          #
          # The scripts all still take proxy= if you set one locally; it is
          # optional everywhere and required nowhere.
          {
            echo "host=$ENV_HOST"
            echo "api_key=$ENV_API_KEY"
            echo "username=$ENV_USERNAME"
            echo "password=$ENV_PASSWORD"
          } > .env

      # No CHROME_PATH: the scripts fall back to Playwright's own Chrome, which
      # `npm ci` installs via the postinstall hook. That used to be a snap
      # instead, and the snap was wrong twice over — `snap install chromium`
      # failed the whole job on an HTTP 408 from the snap store, and a confined
      # browser reports no speech-synthesis voices however many are installed
      # on the host, which the SBSD lane refuses a ledger for.
      - name: make test
        run: make test

      # What voices the runner's browser can actually see. The SBSD lane sends
      # these counts and the sandbox refuses a desktop Chrome reporting none,
      # so when SBSD fails in CI and passes everywhere else, this is the first
      # thing to read. Runs after the suite because it needs its node_modules,
      # and `always()` because the run it explains is the failing one.
      - name: Speech-synthesis voice probe
        if: always()
        continue-on-error: true
        run: xvfb-run -a node dev-resources/voice-probe.mjs

      - uses: cycjimmy/semantic-release-action@v6.0.0
        id: semantic # need an `id` for output variables
        with:
          dry_run: true
          semantic_version: 24
          extra_plugins: |
            @semantic-release/exec@6.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # keep it as `secrets.GITHUB_TOKEN` as repo is public and this token has limited privs

  docker-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    needs:
      - build-and-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: examples
          cache-from: type=gha
          cache-to: type=gha,mode=min

  dependabot-approve-and-automerge:
    runs-on: ubuntu-slim
    needs: build-and-test
    timeout-minutes: 2
    permissions:
      pull-requests: write
      contents: write
    if: github.actor == 'dependabot[bot]'

    steps:
      - uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve a PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
